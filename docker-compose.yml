version: "3.8"

services:

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neobank-net

  app:
    image: neobank-app:latest
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - neobank-net
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file

    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
        - neobank-net
volumes:
  postgres_data:
  keycloak_data:

networks:
  neobank-net:
