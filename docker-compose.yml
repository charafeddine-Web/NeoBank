version: "3.8"

services:

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neobank-net

  app:
    image: neobank-app:latest
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - neobank-net

volumes:
  postgres_data:

networks:
  neobank-net:
