name: Al Baraka - CD

on:
  workflow_run:
    workflows: ["cdi.yml"]
    types:
      - completed

jobs:
  docker-build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Package Application
        run: mvn package -DskipTests -pl neobank-app -am

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./neobank-app
          file: ./neobank-app/Dockerfile
          push: false
          tags: charafweb/neobank-app:${{ github.sha }}
