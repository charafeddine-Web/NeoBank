<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<head>
    <title>Agent Dashboard | NeoBank</title>
</head>

<body>
    <section class="space-y-8">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-900">Agent Console</h1>
                <p class="text-slate-500">Manage and validate pending customer operations.</p>
            </div>
            <div class="flex gap-3">
                <div class="bg-amber-50 border border-amber-100 px-4 py-2 rounded-xl flex items-center">
                    <span class="w-2 h-2 bg-amber-500 rounded-full mr-2 animate-pulse"></span>
                    <span class="text-xs font-bold text-amber-700 uppercase tracking-wider"
                        th:text="${pendingOperations != null ? #lists.size(pendingOperations) : 0} + ' Pending'">0
                        Pending</span>
                </div>
            </div>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${success}"
            class="p-4 bg-emerald-50 border-l-4 border-emerald-500 text-emerald-700 rounded-r-xl shadow-sm"
            th:text="${success}"></div>
        <div th:if="${error}" class="p-4 bg-rose-50 border-l-4 border-rose-500 text-rose-700 rounded-r-xl shadow-sm"
            th:text="${error}"></div>

        <!-- Pending Operations Table -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-100">
                        <tr>
                            <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Operation ID</th>
                            <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Type & Account</th>
                            <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Amount</th>
                            <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase">AI Recommendation</th>
                            <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Document</th>
                            <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-50">
                        <tr th:each="op : ${pendingOperations}" class="hover:bg-slate-50/50 transition-all group">
                            <td class="px-6 py-4">
                                <span class="font-mono text-xs text-slate-400" th:text="'#' + ${op.id}">#123</span>
                            </td>
                            <td class="px-6 py-4">
                                <div>
                                    <p class="text-sm font-bold text-slate-800" th:text="${op.type}">DEPOSIT</p>
                                    <p class="text-[10px] text-slate-400 font-medium tracking-wide"
                                        th:text="'Acc: ' + ${op.sourceAccountNumber}">Acc: 123456</p>
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <p class="text-sm font-black text-slate-900"
                                    th:text="${op.amount} + ' ' + ${op.currency}">15,000 MAD</p>
                            </td>
                            <td class="px-6 py-4">
                                <span th:if="${op.amount != null and op.amount.doubleValue() > 20000}"
                                    class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-100 text-rose-800">
                                    <svg class="-ml-0.5 mr-1.5 h-2 w-2 text-rose-400" fill="currentColor"
                                        viewBox="0 0 8 8">
                                        <circle cx="4" cy="4" r="3" />
                                    </svg>
                                    Review Required
                                </span>
                                <span th:if="${op.amount != null and op.amount.doubleValue() <= 20000}"
                                    class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
                                    <svg class="-ml-0.5 mr-1.5 h-2 w-2 text-emerald-400" fill="currentColor"
                                        viewBox="0 0 8 8">
                                        <circle cx="4" cy="4" r="3" />
                                    </svg>
                                    Low Risk
                                </span>
                                <span th:if="${op.amount == null}" class="text-xs text-slate-400 italic">No
                                    Amount</span>
                            </td>
                            <td class="px-6 py-4">
                                <a th:href="@{/agent/operations/{id}/document(id=${op.id})}" target="_blank"
                                    class="inline-flex items-center text-xs font-bold text-indigo-600 hover:text-indigo-800 group-hover:underline">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none"
                                        viewBox="0 0 24 24" stroke="currentColor">
                                        <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                        <path
                                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                                            stroke-width="2" />
                                    </svg>
                                    View Proof
                                </a>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <div class="flex items-center justify-end space-x-2">
                                    <form th:action="@{/agent/operations/{id}/approve(id=${op.id})}" method="post"
                                        class="flex items-center">
                                        <input type="text" name="comment" placeholder="Add comment..."
                                            class="text-[10px] border border-slate-200 rounded-l-lg py-1 px-2 focus:ring-1 focus:ring-indigo-500 outline-none w-24">
                                        <button type="submit"
                                            class="bg-indigo-600 text-white p-1 rounded-r-lg hover:bg-indigo-700 transition-colors">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                                                viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M5 13l4 4L19 7" />
                                            </svg>
                                        </button>
                                    </form>
                                    <form th:action="@{/agent/operations/{id}/reject(id=${op.id})}" method="post">
                                        <input type="hidden" name="comment" value="Rejected via Dashboard">
                                        <button type="submit"
                                            class="bg-rose-50 text-rose-600 p-1.5 rounded-lg hover:bg-rose-100 transition-colors">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                                                viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M6 18L18 6M6 6l12 12" />
                                            </svg>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pendingOperations)}">
                            <td colspan="6" class="px-6 py-12 text-center text-slate-400 italic">
                                Great! No pending operations left to review.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</body>

</html>
