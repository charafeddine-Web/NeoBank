<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<head>
    <title>Admin Dashboard | NeoBank</title>
</head>

<body>
    <section class="space-y-8">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1
                    class="text-3xl font-bold text-slate-900 text-transparent bg-clip-text bg-gradient-to-r from-red-600 to-indigo-600">
                    Admin Control</h1>
                <p class="text-slate-500">Global system monitoring and user administration.</p>
            </div>
            <div class="flex gap-4">
                <div class="bg-white px-4 py-2 rounded-2xl shadow-sm border border-slate-100 flex items-center">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest mr-2">Status:</span>
                    <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider">Operational</span>
                </div>
            </div>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${success}"
            class="p-4 bg-emerald-50 border-l-4 border-emerald-500 text-emerald-700 rounded-r-xl shadow-sm"
            th:text="${success}"></div>
        <div th:if="${error}" class="p-4 bg-rose-50 border-l-4 border-rose-500 text-rose-700 rounded-r-xl shadow-sm"
            th:text="${error}"></div>

        <!-- User Management Table -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="px-6 py-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                <h2 class="font-bold text-slate-800">System Users</h2>
                <div class="relative">
                    <input type="text" placeholder="Search users..."
                        class="bg-white border border-slate-200 rounded-xl px-4 py-2 text-xs focus:ring-2 focus:ring-indigo-500 outline-none w-64 transition-all">
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-white">
                        <tr>
                            <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">User
                                ID</th>
                            <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Full
                                Name</th>
                            <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                Contact</th>
                            <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Role
                            </th>
                            <th
                                class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">
                                Security Status</th>
                            <th
                                class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right">
                                Management</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-50">
                        <tr th:each="u : ${users}" class="hover:bg-slate-50/80 transition-all cursor-default group">
                            <td class="px-6 py-4">
                                <span class="font-mono text-xs text-slate-400" th:text="'#' + ${u.id}">#1</span>
                            </td>
                            <td class="px-6 py-4">
                                <span class="text-sm font-bold text-slate-800" th:text="${u.username}">john_doe</span>
                            </td>
                            <td class="px-6 py-4">
                                <span class="text-sm text-slate-600" th:text="${u.email}">john@example.com</span>
                            </td>
                            <td class="px-6 py-4">
                                <span
                                    th:classappend="${u.role.name() == 'ADMIN' ? 'bg-indigo-50 text-indigo-700' : 'bg-slate-50 text-slate-700'}"
                                    class="px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest"
                                    th:text="${u.role}">CLIENT</span>
                            </td>
                            <td class="px-6 py-4 text-center">
                                <div class="inline-flex items-center">
                                    <span th:if="${u.isActive}" class="relative flex h-3 w-3 mr-2">
                                        <span
                                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                                    </span>
                                    <span th:unless="${u.isActive}"
                                        class="inline-flex rounded-full h-3 w-3 bg-rose-500 mr-2"></span>
                                    <span th:text="${u.isActive ? 'Active' : 'Suspended'}"
                                        class="text-[10px] font-bold uppercase tracking-wider"
                                        th:classappend="${u.isActive ? 'text-emerald-700' : 'text-rose-700'}">Active</span>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <form th:if="${u.isActive}" th:action="@{/admin/users/{id}/suspend(id=${u.id})}"
                                    method="post" class="inline">
                                    <button type="submit"
                                        class="text-xs font-bold text-rose-600 hover:text-rose-800 bg-rose-50 px-4 py-2 rounded-xl transition-all shadow-sm hover:shadow-md">
                                        Suspend Access
                                    </button>
                                </form>
                                <form th:unless="${u.isActive}" th:action="@{/admin/users/{id}/activate(id=${u.id})}"
                                    method="post" class="inline">
                                    <button type="submit"
                                        class="text-xs font-bold text-emerald-600 hover:text-emerald-800 bg-emerald-50 px-4 py-2 rounded-xl transition-all shadow-sm hover:shadow-md">
                                        Restore Access
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</body>

</html>
