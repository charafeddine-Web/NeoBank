<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">

<head>
    <title>Submit Proof | NeoBank</title>
</head>

<body>
    <section class="max-w-xl mx-auto py-12">
        <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
            <div class="p-8 text-center border-b border-slate-50">
                <div
                    class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Upload Document</h1>
                <p class="text-sm text-slate-500 mt-1">Please provide the supporting document for operation #<span
                        th:text="${operationId}" class="font-mono text-indigo-600 font-bold">0</span></p>
            </div>

            <div class="p-8">
                <div th:if="${error}"
                    class="mb-6 p-4 bg-rose-50 border-l-4 border-rose-500 text-rose-700 text-sm rounded-r-xl"
                    th:text="${error}"></div>

                <form th:action="@{/client/operations/{id}/upload(id=${operationId})}" method="post"
                    enctype="multipart/form-data" class="space-y-6">
                    <div
                        class="bg-slate-50 border-2 border-dashed border-slate-200 rounded-3xl p-10 text-center hover:border-indigo-400 transition-colors cursor-pointer group relative">
                        <input type="file" id="file" name="file" required accept=".pdf,image/png,image/jpeg"
                            class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <div class="relative z-0">
                            <p
                                class="text-sm font-semibold text-slate-700 group-hover:text-indigo-600 transition-colors">
                                Click to select or drag and drop</p>
                            <p class="text-xs text-slate-400 mt-2">Accepted formats: PDF, PNG, JPG (Max 5MB)</p>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-4">
                        <a th:href="@{/client/dashboard}" class="text-sm font-bold text-slate-500 hover:underline">
                            Go back
                        </a>
                        <button type="submit"
                            class="px-10 py-3 bg-slate-900 text-white font-bold rounded-xl hover:bg-slate-800 transition-all shadow-lg">
                            Submit Proof
                        </button>
                    </div>
                </form>
            </div>

            <div class="px-8 py-4 bg-slate-50 text-[10px] text-slate-400 text-center uppercase tracking-widest">
                Protected by NeoBank Security Systems
            </div>
        </div>
    </section>
</body>

</html>
